<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Xtream TV</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HLS.js para reproducción de streams M3U8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, get, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    
    // Firebase Config Pública de Prueba / Demo
    const firebaseConfig = {
      databaseURL: "https://xtream-tv-chat-default-rtdb.firebaseio.com/"
    };
    
    // Inicializar Firebase
    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      window.firebaseDb = db;
      window.fbRef = ref;
      window.fbPush = push;
      window.fbOnChildAdded = onChildAdded;
      window.fbSet = set;
      window.fbGet = get;
      window.fbQuery = query;
      window.fbLimitToLast = limitToLast;
      console.log("Firebase conectado correctamente.");
    } catch (e) {
      console.error("Error al conectar Firebase:", e);
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #141414; color: #fff; }
    
    /* Estilos para sombreado en minichat overlay */
    .text-shadow-video {
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 5px rgba(0,0,0,0.7);
    }

    /* Contenedor Flex Layouts Laterales */
    #mediaLayoutWrapper.layout-left,
    #mediaLayoutWrapper.layout-right {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 16px;
      width: 100%;
      max-width: 100% !important;
    }
    #mediaLayoutWrapper.layout-left .video-wrapper,
    #mediaLayoutWrapper.layout-right .video-wrapper {
      flex: 1;
      min-width: 0;
    }
    #mediaLayoutWrapper.layout-left .chat-panel,
    #mediaLayoutWrapper.layout-right .chat-panel {
      width: 350px;
      flex-shrink: 0;
      position: relative !important;
      height: auto !important;
      max-height: 500px;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
    }
    #mediaLayoutWrapper.layout-left {
      flex-direction: row-reverse;
    }
    
    /* Layout Arriba / Abajo */
    #mediaLayoutWrapper.layout-top,
    #mediaLayoutWrapper.layout-bottom {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    #mediaLayoutWrapper.layout-top .chat-panel,
    #mediaLayoutWrapper.layout-bottom .chat-panel {
      position: relative !important;
      width: 100% !important;
      height: 200px !important;
      top: auto !important;
      left: auto !important;
    }
    #mediaLayoutWrapper.layout-top {
      flex-direction: column-reverse;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

  <!-- TOP NAVBAR -->
  <header class="bg-[#181818] border-b border-neutral-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-4">
      <button id="menuToggleBtn" class="p-2 text-neutral-400 hover:text-white focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <h1 class="text-xl font-bold tracking-wider text-red-600 flex items-center gap-2">
        <span>🎬</span> XTREAM TV
      </h1>
    </div>
    
    <div class="flex items-center space-x-4">
      <div id="activeRoomBadge" class="text-xs bg-neutral-800 text-neutral-300 px-3 py-1 rounded-full border border-neutral-700">
        Sala: Canales Generales
      </div>
    </div>
  </header>

  <!-- SIDEBAR MENU DESPLEGABLE -->
  <div id="sidebarMenu" class="fixed inset-y-0 left-0 w-80 bg-[#1f1f1f] border-r border-neutral-800 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
    <div class="p-5 border-b border-neutral-800 flex items-center justify-between">
      <h2 class="font-bold text-lg text-white">Menú Principal</h2>
      <button id="closeMenuBtn" class="text-neutral-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div class="p-4 flex-1 overflow-y-auto space-y-6">
      <!-- Sección Canales por Defecto -->
      <div>
        <h3 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Canales Destacados</h3>
        <div id="defaultChannelsList" class="space-y-1">
          <!-- Se llena por JS -->
        </div>
      </div>

      <!-- Sección Agregar M3U -->
      <div class="border-t border-neutral-800 pt-4">
        <h3 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Agregar Lista M3U (Link)</h3>
        <div class="space-y-2">
          <input type="text" id="m3uUrlInput" placeholder="https://ejemplo.com/lista.m3u" class="w-full bg-neutral-900 border border-neutral-700 text-sm rounded px-3 py-2 text-white focus:outline-none focus:border-red-600">
          <button id="loadM3uBtn" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 rounded transition">Cargar por URL</button>
        </div>
      </div>

      <!-- Sección Archivos Locales (Video o M3U) -->
      <div class="border-t border-neutral-800 pt-4">
        <h3 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Cargar Archivo Local (.m3u / Video)</h3>
        <input type="file" id="localMediaInput" accept=".m3u,.m3u8,video/*,audio/*" class="block w-full text-xs text-neutral-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-neutral-800 file:text-white hover:file:bg-neutral-700 cursor-pointer">
      </div>
    </div>
  </div>

  <!-- OVERLAY BACKDROP MENU -->
  <div id="sidebarBackdrop" class="fixed inset-0 bg-black/60 z-40 hidden"></div>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col justify-center items-center">
    
    <!-- WRAPPER PRINCIPAL (Video + Chat dinámico) -->
    <div id="mediaLayoutWrapper" class="relative w-full max-w-5xl mx-auto flex flex-col shadow-2xl rounded-xl overflow-hidden bg-black border border-neutral-800">
      
      <!-- REPRODUCTOR DE VIDEO -->
      <div class="video-wrapper relative w-full aspect-video bg-black flex items-center justify-center">
        <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay></video>
        
        <!-- BARRA SUPERIOR DE CONTROLES DEL REPRODUCTOR -->
        <div class="absolute top-3 right-3 z-30 flex items-center space-x-2 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/10">
          <span id="currentTitle" class="text-xs font-medium text-white max-w-[200px] truncate">Selecciona un canal</span>
          <!-- Botón Configuración del Chat -->
          <div class="relative">
            <button id="chatConfigToggle" class="text-neutral-300 hover:text-white p-1 rounded focus:outline-none" title="Configurar Chat">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </button>
            
            <!-- MENÚ DESPLEGABLE DE CONFIGURACIÓN DEL CHAT -->
            <div id="chatConfigMenu" class="absolute right-0 mt-2 w-56 bg-[#1f1f1f] border border-neutral-700 rounded-lg shadow-2xl py-2 hidden z-50 text-xs">
              <div class="px-3 py-1 font-semibold text-neutral-400 uppercase tracking-wider border-b border-neutral-700 mb-1">Posición del Chat</div>
              <button onclick="setChatLayout('overlay')" class="w-full text-left px-4 py-2 hover:bg-neutral-700 text-white flex items-center justify-between">Flotante (Overlay)</button>
              <button onclick="setChatLayout('right')" class="w-full text-left px-4 py-2 hover:bg-neutral-700 text-white flex items-center justify-between">A la derecha</button>
              <button onclick="setChatLayout('left')" class="w-full text-left px-4 py-2 hover:bg-neutral-700 text-white flex items-center justify-between">A la izquierda</button>
              <button onclick="setChatLayout('bottom')" class="w-full text-left px-4 py-2 hover:bg-neutral-700 text-white flex items-center justify-between">Abajo del video</button>
              
              <div class="border-t border-neutral-700 my-1"></div>
              <div class="px-3 py-1 font-semibold text-neutral-400 uppercase tracking-wider border-b border-neutral-700 mb-1">Acciones</div>
              <button id="shareRoomBtn" class="w-full text-left px-4 py-2 hover:bg-red-600 text-white font-medium flex items-center gap-2">
                <span>🔗</span> Compartir Sala
              </button>
              <button id="popoutChatBtn" class="w-full text-left px-4 py-2 hover:bg-neutral-700 text-white flex items-center gap-2">
                <span>↗</span> Abrir en Pestaña
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- PANEL DE CHAT DINÁMICO -->
      <div id="chatPanel" class="chat-panel absolute top-4 left-4 z-20 w-80 h-96 bg-neutral-900/90 backdrop-blur-md border border-neutral-700/80 rounded-xl flex flex-col shadow-2xl transition-all duration-300">
        
        <!-- Cabecera del Chat -->
        <div class="p-3 border-b border-neutral-800 flex items-center justify-between bg-black/40">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
            <span id="chatRoomTitle" class="text-xs font-bold text-white truncate max-w-[150px]">Chat en Vivo</span>
          </div>
          <span id="onlineCount" class="text-[10px] bg-neutral-800 text-neutral-400 px-2 py-0.5 rounded">En línea</span>
        </div>

        <!-- Lista de Mensajes -->
        <div id="messagesList" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
          <div class="text-neutral-500 text-center italic py-4">Conectando al chat de la sala...</div>
        </div>

        <!-- Input para Enviar Mensajes -->
        <div class="p-3 border-t border-neutral-800 bg-black/50">
          <div id="nicknameSection" class="mb-2 flex gap-1">
            <input type="text" id="nicknameInput" placeholder="Tu apodo..." class="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-red-600">
            <button id="saveNicknameBtn" class="bg-neutral-700 hover:bg-neutral-600 text-white px-3 py-1 rounded text-xs">Fijar</button>
          </div>
          <form id="messageForm" class="flex gap-1">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." class="flex-1 bg-neutral-800 border border-neutral-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-red-600" autocomplete="off">
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-xs font-medium transition">Enviar</button>
          </form>
        </div>

      </div>

    </div>

    <!-- SECCIÓN DE CATEGORÍAS Y CANALES M3U CARGADOS -->
    <div id="customPlaylistContainer" class="w-full max-w-5xl mt-8 hidden">
      <div class="flex items-center justify-between mb-4">
        <h3 id="playlistNameTitle" class="text-sm font-bold text-neutral-300 uppercase tracking-wider">Lista M3U Cargada</h3>
        <span id="playlistCountBadge" class="text-xs bg-neutral-800 text-neutral-400 px-2.5 py-1 rounded-full">0 canales</span>
      </div>
      
      <!-- Pestañas de Categorías -->
      <div id="categoryTabs" class="flex flex-wrap gap-2 mb-4">
        <!-- Generado dinámicamente -->
      </div>

      <!-- Cuadrícula de Canales de la Categoría Activa -->
      <div id="playlistItemsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- Se llena por JS -->
      </div>
    </div>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Canales por defecto de prueba (con HLS público libre)
    const defaultChannels = [
      {
        name: "Big Buck Bunny (Prueba HD)",
        url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
        room: "canal-big-buck-bunny",
        category: "Destacados"
      },
      {
        name: "Sintel Animation Stream",
        url: "https://bitmovin-a.akamaihd.net/content/sintel/hls/playlist.m3u8",
        room: "canal-sintel",
        category: "Películas"
      },
      {
        name: "Tears of Steel 4K Stream",
        url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8",
        room: "canal-tears-of-steel",
        category: "Series"
      }
    ];

    let currentRoom = "canal-big-buck-bunny";
    let currentUser = "Usuario_" + Math.floor(Math.random() * 1000);
    let loadedPlaylistCategories = {}; // { "Categoría 1": [ {name, url}, ... ] }
    let activeCategory = "";

    document.getElementById('nicknameInput').value = currentUser;

    // Inicializar reproductor HLS
    const video = document.getElementById('videoPlayer');
    let hls = null;

    function playStream(url, title, roomId) {
      currentRoom = roomId || "sala-general-default";
      document.getElementById('currentTitle').innerText = title;
      document.getElementById('activeRoomBadge').innerText = "Sala: " + title;
      document.getElementById('chatRoomTitle').innerText = title;

      // Actualizar URL de compartir si hay parámetros
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('room', currentRoom);
      newUrl.searchParams.set('url', encodeURIComponent(url));
      newUrl.searchParams.set('title', encodeURIComponent(title));
      window.history.pushState({}, '', newUrl);

      // Conectar Chat a la nueva sala
      initChatRoom(currentRoom);

      if (Hls.isSupported()) {
        if (hls) { hls.destroy(); }
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => { video.play().catch(() => {}); });
      } else {
        video.src = url;
        video.play().catch(() => {});
      }
    }

    // Renderizar Canales por Defecto
    function renderDefaultChannels() {
      const listContainer = document.getElementById('defaultChannelsList');
      listContainer.innerHTML = '';
      defaultChannels.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left px-3 py-2 rounded text-sm text-neutral-300 hover:bg-neutral-800 hover:text-white transition truncate flex items-center gap-2";
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-600"></span> ${ch.name}`;
        btn.onclick = () => {
          playStream(ch.url, ch.name, ch.room);
          closeSidebar();
        };
        listContainer.appendChild(btn);
      });
    }

    // Menú Lateral Toggle
    const sidebar = document.getElementById('sidebarMenu');
    const backdrop = document.getElementById('sidebarBackdrop');

    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      backdrop.classList.remove('hidden');
    }
    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
    }

    document.getElementById('menuToggleBtn').onclick = openSidebar;
    document.getElementById('closeMenuBtn').onclick = closeSidebar;
    backdrop.onclick = closeSidebar;

    // Configuración del Chat Menú Toggle
    const chatConfigToggle = document.getElementById('chatConfigToggle');
    const chatConfigMenu = document.getElementById('chatConfigMenu');

    chatConfigToggle.onclick = (e) => {
      e.stopPropagation();
      chatConfigMenu.classList.toggle('hidden');
    };

    document.onclick = () => {
      chatConfigMenu.classList.add('hidden');
    };

    // Cambiar Layout del Chat
    window.setChatLayout = function(mode) {
      const wrapper = document.getElementById('mediaLayoutWrapper');
      const chatPanel = document.getElementById('chatPanel');

      wrapper.className = "relative w-full max-w-5xl mx-auto flex flex-col shadow-2xl rounded-xl overflow-hidden bg-black border border-neutral-800";
      chatPanel.className = "chat-panel w-80 h-96 bg-neutral-900/90 backdrop-blur-md border border-neutral-700/80 rounded-xl flex flex-col shadow-2xl transition-all duration-300";

      if (mode === 'overlay') {
        chatPanel.classList.add('absolute', 'top-4', 'left-4', 'z-20');
      } else if (mode === 'right') {
        wrapper.classList.add('layout-right');
      } else if (mode === 'left') {
        wrapper.classList.add('layout-left');
      } else if (mode === 'bottom') {
        wrapper.classList.add('layout-bottom');
      }
      chatConfigMenu.classList.add('hidden');
    };

    // Compartir Sala
    document.getElementById('shareRoomBtn').onclick = () => {
      navigator.clipboard.writeText(window.location.href);
      alert("¡Enlace de sala copiado al portapapeles! Compártelo con otros usuarios para unirse a tu transmisión y chat.");
      chatConfigMenu.classList.add('hidden');
    };

    // Abrir en Pestaña (Pop-out Chat)
    document.getElementById('popoutChatBtn').onclick = () => {
      const chatHtml = window.location.href;
      window.open(chatHtml, '_blank', 'width=400,height=600');
      chatConfigMenu.classList.add('hidden');
    };

    // FIJAR APODO
    document.getElementById('saveNicknameBtn').onclick = () => {
      const nick = document.getElementById('nicknameInput').value.trim();
      if (nick) {
        currentUser = nick;
        alert("Apodo guardado como: " + currentUser);
      }
    };

    // SISTEMA DE CHAT FIREBASE
    function initChatRoom(roomId) {
      const messagesList = document.getElementById('messagesList');
      messagesList.innerHTML = '<div class="text-neutral-500 text-center italic py-2">Cargando mensajes...</div>';

      if (!window.firebaseDb) {
        messagesList.innerHTML = '<div class="text-red-400 text-center text-xs">Error: Firebase no inicializado.</div>';
        return;
      }

      const cleanRoomId = roomId.replace(/[^a-zA-Z0-9_-]/g, '_');
      const chatRef = window.fbRef(window.firebaseDb, 'chats/' + cleanRoomId);
      const lastMessagesQuery = window.fbQuery(chatRef, window.fbLimitToLast(50));

      messagesList.innerHTML = '';
      
      window.fbOnChildAdded(lastMessagesQuery, (snapshot) => {
        const msg = snapshot.val();
        appendMessageUI(msg.user, msg.text, msg.time);
      });
    }

    function appendMessageUI(user, text, time) {
      const messagesList = document.getElementById('messagesList');
      const div = document.createElement('div');
      div.className = "flex flex-col";
      div.innerHTML = `
        <div class="flex items-baseline space-x-1">
          <span class="font-bold text-red-400 text-[11px]">${escapeHtml(user)}</span>
          <span class="text-[9px] text-neutral-500">${time || ''}</span>
        </div>
        <span class="text-neutral-200 text-xs break-words text-shadow-video">${escapeHtml(text)}</span>
      `;
      messagesList.appendChild(div);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // Enviar Mensaje
    document.getElementById('messageForm').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const cleanRoomId = currentRoom.replace(/[^a-zA-Z0-9_-]/g, '_');
      const chatRef = window.fbRef(window.firebaseDb, 'chats/' + cleanRoomId);

      window.fbPush(chatRef, {
        user: currentUser,
        text: text,
        time: time
      }).then(() => {
        input.value = '';
      }).catch(err => {
        console.error("Error al enviar mensaje:", err);
      });
    };

    // PROCESAMIENTO INTELIGENTE DE M3U (Extrae categorías y agrupa)
    function parseM3UContent(m3uText, playlistTitle) {
      const lines = m3uText.split(/?
/);
      loadedPlaylistCategories = {};
      let totalCount = 0;

      let currentTitle = "Canal sin nombre";
      let currentCategory = "General / Otros";

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          // Extraer atributos como group-title si existen
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          if (groupMatch && groupMatch[1]) {
            currentCategory = groupMatch[1].trim();
          } else {
            currentCategory = "Canales de TV y Otros";
          }

          // Extraer el título del canal después de la última coma
          const commaIndex = line.lastIndexOf(',');
          if (commaIndex !== -1) {
            currentTitle = line.substring(commaIndex + 1).trim();
          }
        } else if (line && !line.startsWith('#')) {
          // Es una URL válida de streaming
          let url = line;
          
          // Clasificación automática inteligente basada en el nombre o categoría si es genérica
          let lowerTitle = currentTitle.toLowerCase();
          let lowerCat = currentCategory.toLowerCase();

          if (lowerCat.includes('radio') || lowerTitle.includes('radio') || lowerTitle.includes('fm')) {
            currentCategory = "Radios Online";
          } else if (lowerCat.includes('pelicula') || lowerCat.includes('movie') || lowerTitle.includes('vof') || lowerTitle.includes('cine')) {
            currentCategory = "Películas";
          } else if (lowerCat.includes('serie') || lowerCat.includes('capitulo') || lowerCat.includes('temporada')) {
            currentCategory = "Series";
          } else if (lowerCat.includes('sport') || lowerCat.includes('deporte') || lowerTitle.includes('espn') || lowerTitle.includes('fox sports')) {
            currentCategory = "Deportes";
          }

          if (!loadedPlaylistCategories[currentCategory]) {
            loadedPlaylistCategories[currentCategory] = [];
          }

          loadedPlaylistCategories[currentCategory].push({
            name: currentTitle,
            url: url
          });

          totalCount++;
          currentTitle = "Canal sin nombre";
          currentCategory = "General / Otros";
        }
      }

      if (totalCount > 0) {
        document.getElementById('playlistNameTitle').innerText = "Lista: " + playlistTitle;
        document.getElementById('playlistCountBadge').innerText = totalCount + " elementos";
        document.getElementById('customPlaylistContainer').classList.remove('hidden');

        // Seleccionar la primera categoría disponible por defecto
        const categories = Object.keys(loadedPlaylistCategories);
        if (categories.length > 0) {
          switchCategory(categories[0]);
        }

        // Reproducir el primer canal automáticamente
        const firstCat = categories[0];
        const firstChannel = loadedPlaylistCategories[firstCat][0];
        playStream(firstChannel.url, firstChannel.name, "sala-m3u-" + firstChannel.name.replace(/[^a-zA-Z0-9]/g, '_'));

        alert(`¡Lista M3U procesada con éxito! Se organizaron ${totalCount} canales en ${categories.length} categorías.`);
      } else {
        alert("No se encontraron enlaces de streaming válidos en el archivo M3U.");
      }
    }

    // Cambiar de Categoría en la UI
    window.switchCategory = function(catName) {
      activeCategory = catName;
      
      // Renderizar pestañas
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = '';
      
      Object.keys(loadedPlaylistCategories).forEach(cat => {
        const btn = document.createElement('button');
        const isActive = cat === activeCategory;
        btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
          isActive 
            ? 'bg-red-600 text-white shadow-lg' 
            : 'bg-neutral-800 text-neutral-300 hover:bg-neutral-700'
        }`;
        btn.innerText = `${cat} (${loadedPlaylistCategories[cat].length})`;
        btn.onclick = () => switchCategory(cat);
        tabsContainer.appendChild(btn);
      });

      // Renderizar botones de canales de esta categoría
      const gridContainer = document.getElementById('playlistItemsGrid');
      gridContainer.innerHTML = '';

      const channels = loadedPlaylistCategories[catName] || [];
      channels.forEach(ch => {
        const card = document.createElement('button');
        card.className = "bg-neutral-900 border border-neutral-800 hover:border-red-600 p-3 rounded-lg text-left transition flex flex-col justify-between group";
        card.innerHTML = `
          <div class="flex items-center space-x-2 mb-2">
            <span class="w-2 h-2 rounded-full bg-red-600 group-hover:scale-125 transition"></span>
            <span class="text-xs font-bold text-white truncate">${escapeHtml(ch.name)}</span>
          </div>
          <span class="text-[10px] text-neutral-400 group-hover:text-red-400 font-medium">Reproducir canal →</span>
        `;
        card.onclick = () => {
          playStream(ch.url, ch.name, "sala-m3u-" + ch.name.replace(/[^a-zA-Z0-9]/g, '_'));
        };
        gridContainer.appendChild(card);
      });
    };

    // CARGAR M3U POR URL
    document.getElementById('loadM3uBtn').onclick = async () => {
      const url = document.getElementById('m3uUrlInput').value.trim();
      if (!url) {
        alert("Por favor ingresa una URL M3U válida.");
        return;
      }

      try {
        alert("Descargando y procesando lista M3U...");
        const response = await fetch(url);
        const text = await response.text();
        parseM3UContent(text, "Lista M3U Remota");
        closeSidebar();
      } catch (e) {
        console.error(e);
        alert("No se pudo descargar la lista M3U por restricciones de CORS del navegador. Prueba cargando el archivo M3U directamente desde tu dispositivo.");
      }
    };

    // CARGAR ARCHIVO LOCAL (.m3u o video)
    document.getElementById('localMediaInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.name.endsWith('.m3u') || file.name.endsWith('.m3u8')) {
        const reader = new FileReader();
        reader.onload = function(event) {
          parseM3UContent(event.target.result, file.name);
          closeSidebar();
        };
        reader.readAsText(file);
      } else {
        const fileURL = URL.createObjectURL(file);
        playStream(fileURL, file.name, "local-file-" + file.name.replace(/[^a-zA-Z0-9]/g, '_'));
        closeSidebar();
      }
    };

    // INICIALIZAR AL CARGAR LA PÁGINA
    window.onload = () => {
      renderDefaultChannels();
      
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      const urlParam = params.get('url');
      const titleParam = params.get('title');

      if (urlParam) {
        const decodedUrl = decodeURIComponent(urlParam);
        const decodedTitle = titleParam ? decodeURIComponent(titleParam) : "Sala Compartida";
        playStream(decodedUrl, decodedTitle, roomParam || "sala-compartida");
      } else {
        playStream(defaultChannels[0].url, defaultChannels[0].name, defaultChannels[0].room);
      }
    };
  </script>
</body>
</html>
