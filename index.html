<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto xtream tv</title>
    <!-- Tailwind CSS for sleek, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for m3u8 playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }

        .channel-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .channel-card:hover {
            transform: scale(1.05);
        }

        .text-shadow-video {
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9), 0px 0px 5px rgba(0,0,0,0.7);
        }

        /* Flexbox layouts with side-by-side support */
        #mediaLayoutWrapper.layout-right {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 16px;
        }
        #mediaLayoutWrapper.layout-right .video-col {
            flex: 1;
            min-width: 0;
        }
        #mediaLayoutWrapper.layout-right .chat-panel {
            width: 350px;
            flex-shrink: 0;
            position: relative;
            height: auto;
        }

        #mediaLayoutWrapper.layout-left {
            display: flex;
            flex-direction: row-reverse;
            align-items: stretch;
            gap: 16px;
        }
        #mediaLayoutWrapper.layout-left .video-col {
            flex: 1;
            min-width: 0;
        }
        #mediaLayoutWrapper.layout-left .chat-panel {
            width: 350px;
            flex-shrink: 0;
            position: relative;
            height: auto;
        }

        #mediaLayoutWrapper.layout-bottom {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #mediaLayoutWrapper.layout-bottom .chat-panel {
            width: 100%;
            height: 350px;
            position: relative;
        }

        #mediaLayoutWrapper.layout-top {
            display: flex;
            flex-direction: column-reverse;
            gap: 16px;
        }
        #mediaLayoutWrapper.layout-top .chat-panel {
            width: 100%;
            height: 350px;
            position: relative;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="w-full py-4 px-6 md:px-12 flex justify-between items-center bg-gradient-to-b from-black/90 to-transparent fixed top-0 z-50">
        <div class="flex items-center gap-4">
            <!-- Hamburger Menu Button -->
            <button id="openMenuBtn" class="text-zinc-300 hover:text-white transition-colors p-1 rounded-lg hover:bg-white/10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <h1 class="text-3xl font-black tracking-tighter text-red-600 drop-shadow-md">XTREAM<span class="text-white">TV</span></h1>
        </div>
        <div class="flex gap-2">
            <button id="toggleMiniChatBtn" class="bg-red-600/90 hover:bg-red-700 text-white text-sm font-medium py-2 px-4 rounded-full backdrop-blur-sm transition-colors border border-red-500 shadow-lg flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                </svg>
                Chat
            </button>
        </div>
    </header>

    <!-- Slide-out Sidebar Menu -->
    <div id="sidebarBackdrop" class="fixed inset-0 bg-black/70 z-50 hidden backdrop-blur-sm transition-opacity"></div>
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-80 bg-zinc-900 border-r border-zinc-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
            <h2 class="font-bold text-lg text-white">Menú Principal</h2>
            <button id="closeMenuBtn" class="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-zinc-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        
        <div class="flex-grow overflow-y-auto p-4 flex flex-col gap-6">
            <!-- Section: Default Channels -->
            <div>
                <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Contenido por Defecto</h3>
                <button id="menuDefaultHome" class="w-full text-left px-3 py-2 rounded-lg bg-red-600/20 text-red-400 font-medium text-sm flex items-center gap-2 border border-red-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Canales en Vivo
                </button>
            </div>

            <!-- Section: M3U Lists -->
            <div>
                <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Agregar Lista M3U</h3>
                <div class="flex flex-col gap-2">
                    <input type="text" id="m3uUrlInput" placeholder="https://ejemplo.com/lista.m3u" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-xs text-white focus:outline-none focus:border-red-500">
                    <button id="loadM3uBtn" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-medium py-2 rounded border border-zinc-600 transition-colors">Cargar Lista M3U</button>
                </div>
            </div>

            <!-- Section: Xtream Codes -->
            <div>
                <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Servidor Xtream Codes</h3>
                <div class="flex flex-col gap-2">
                    <input type="text" id="xtreamUrl" placeholder="URL Servidor (ej: http://server:8080)" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-xs text-white focus:outline-none focus:border-red-500">
                    <input type="text" id="xtreamUser" placeholder="Usuario" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-xs text-white focus:outline-none focus:border-red-500">
                    <input type="password" id="xtreamPass" placeholder="Contraseña" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-xs text-white focus:outline-none focus:border-red-500">
                    <button id="loadXtreamBtn" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-medium py-2 rounded border border-zinc-600 transition-colors">Conectar Xtream</button>
                </div>
            </div>

            <!-- Section: Local Media -->
            <div>
                <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Archivo Local (Video / Música)</h3>
                <label class="w-full bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-medium py-2 px-3 rounded border border-zinc-600 transition-colors flex items-center justify-center gap-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    Seleccionar Archivo Local
                    <input type="file" id="localFileInput" accept="video/*,audio/*" class="hidden">
                </label>
            </div>
        </div>
    </aside>

    <!-- Main Content Area: Player -->
    <main class="flex-grow flex flex-col pt-[72px] lg:pt-[80px] px-4 md:px-8 gap-4 max-w-[1920px] mx-auto w-full">
        
        <!-- Video Player Section -->
        <section id="playerContainer" class="w-full flex flex-col rounded-xl overflow-hidden bg-black shadow-2xl relative border border-zinc-800 mx-auto">
            
            <!-- FLEX WRAPPER FOR VIDEO AND CHAT -->
            <div id="mediaLayoutWrapper" class="w-full relative bg-black transition-all duration-300">
                
                <!-- Video Column -->
                <div id="videoCol" class="video-col relative w-full flex flex-col justify-center">
                    <div class="aspect-video w-full bg-black relative overflow-hidden group">
                        <video id="videoElement" class="w-full h-full object-contain" controls autoplay playsinline></video>
                        <div id="videoLoading" class="absolute inset-0 flex items-center justify-center bg-black/50 hidden">
                            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600"></div>
                        </div>
                    </div>
                </div>

                <!-- Chat Overlay / Docked Panel -->
                <div id="miniChatOverlay" class="chat-panel absolute top-4 left-4 w-80 h-[60%] bg-black/40 backdrop-blur-md rounded-xl border border-white/20 flex flex-col z-30 transition-all duration-300 shadow-2xl">
                    <!-- Header -->
                    <div class="px-3 py-2 border-b border-white/20 bg-black/60 flex justify-between items-center">
                        <span id="chatRoomTitle" class="text-xs font-bold text-white/90 drop-shadow-md flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></span>
                            Chat en vivo
                        </span>
                        <div class="flex items-center gap-1">
                            <button id="chatSettingsBtn" class="text-white/70 hover:text-white transition-colors p-1 rounded hover:bg-white/10" title="Configuración de Chat">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Settings Panel -->
                    <div id="chatSettingsPanel" class="hidden absolute top-10 right-2 bg-zinc-900 border border-zinc-700 rounded-lg shadow-xl z-40 w-64 p-3 text-sm flex flex-col gap-3">
                        <div>
                            <label class="text-zinc-400 text-xs font-bold block mb-1">Vista del Chat</label>
                            <select id="layoutSelect" class="w-full bg-zinc-800 text-white text-xs border border-zinc-700 rounded p-1 focus:outline-none focus:border-red-500">
                                <option value="floating">Flotante (Overlay)</option>
                                <option value="right">A la derecha</option>
                                <option value="left">A la izquierda</option>
                                <option value="bottom">Debajo del video</option>
                                <option value="top">Arriba del video</option>
                            </select>
                        </div>
                        <div id="posSettingWrap">
                            <label class="text-zinc-400 text-xs font-bold block mb-1">Posición (Flotante)</label>
                            <select id="posSelect" class="w-full bg-zinc-800 text-white text-xs border border-zinc-700 rounded p-1 focus:outline-none focus:border-red-500">
                                <option value="tl">Arriba Izquierda</option>
                                <option value="tr">Arriba Derecha</option>
                                <option value="bl">Abajo Izquierda</option>
                                <option value="br">Abajo Derecha</option>
                            </select>
                        </div>
                        <div id="sizeSettingWrap">
                            <label class="text-zinc-400 text-xs font-bold block mb-1">Tamaño (Flotante)</label>
                            <select id="sizeSelect" class="w-full bg-zinc-800 text-white text-xs border border-zinc-700 rounded p-1 focus:outline-none focus:border-red-500">
                                <option value="medium">Mediano</option>
                                <option value="small">Pequeño</option>
                                <option value="large">Grande</option>
                            </select>
                        </div>
                        <button id="shareRoomBtn" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs py-1.5 rounded font-medium flex items-center justify-center gap-1 transition-colors mt-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                            Compartir Sala
                        </button>
                    </div>

                    <!-- Setup Nickname -->
                    <div id="nicknameSetup" class="flex flex-col items-center justify-center flex-grow p-4 bg-black/40">
                        <input type="text" id="nicknameInput" placeholder="Elige un apodo..." class="w-full px-3 py-1.5 bg-black/60 border border-white/20 rounded-md text-white text-sm focus:outline-none focus:border-red-500 mb-2" maxlength="15">
                        <button id="joinChatBtn" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-1.5 rounded-md transition-colors">Entrar al Chat</button>
                    </div>

                    <!-- Messages Container -->
                    <div id="activeChat" class="hidden flex-col flex-grow overflow-hidden">
                        <div id="miniMessagesList" class="flex-grow overflow-y-auto p-3 flex flex-col gap-2 relative"></div>
                        <!-- Chat Input -->
                        <div class="p-2 bg-black/60 border-t border-white/20">
                            <form id="chatForm" class="flex gap-2">
                                <input type="text" id="messageInput" placeholder="Mensaje..." class="flex-grow px-2 py-1.5 bg-black/40 border border-white/20 rounded text-xs text-white focus:outline-none focus:border-red-500 placeholder-zinc-400" autocomplete="off">
                                <button type="submit" id="sendBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded transition-colors flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Video Info Bar -->
            <div class="p-4 bg-zinc-900 border-t border-zinc-800 w-full z-20">
                <h2 id="mediaTitle" class="text-xl font-bold">Documentales TV - En Vivo</h2>
                <p id="mediaDesc" class="text-zinc-400 text-sm mt-1">Transmisión de prueba (HLS / m3u8)</p>
            </div>
        </section>
    </main>

    <!-- Channels Carousel -->
    <section class="mt-8 mb-12 px-4 md:px-8 w-full max-w-[1920px] mx-auto">
        <h3 class="text-xl font-bold mb-4 px-2">Canales Sugeridos</h3>
        <div id="channelsCarousel" class="flex gap-4 overflow-x-auto no-scrollbar pb-4 px-2 snap-x snap-mandatory">
            
            <div class="channel-card snap-start flex-shrink-0 w-[240px] md:w-[280px] cursor-pointer group" data-src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" data-title="Documentales TV - En Vivo" data-channel="docu_01">
                <div class="aspect-[16/9] rounded-md overflow-hidden bg-zinc-800 relative shadow-lg">
                    <img src="https://placehold.co/600x338/18181b/e4e4e7?text=Docu+TV" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity">
                    <div class="absolute bottom-2 left-2 bg-red-600 px-2 py-1 rounded text-xs font-bold text-white shadow-md">EN VIVO</div>
                </div>
                <p class="mt-2 text-sm font-bold text-white">Documentales TV</p>
            </div>

            <div class="channel-card snap-start flex-shrink-0 w-[240px] md:w-[280px] cursor-pointer group" data-src="https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8" data-title="Cine Premium 24/7" data-channel="cine_02">
                <div class="aspect-[16/9] rounded-md overflow-hidden bg-zinc-800 relative shadow-lg">
                    <img src="https://placehold.co/600x338/18181b/e4e4e7?text=Cine+TV" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity">
                    <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-1 rounded text-xs font-bold text-white border border-zinc-700">CINE</div>
                </div>
                <p class="mt-2 text-sm font-medium text-zinc-300 group-hover:text-white transition-colors">Cine Premium 24/7</p>
            </div>

            <div class="channel-card snap-start flex-shrink-0 w-[240px] md:w-[280px] cursor-pointer group" data-src="https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" data-title="Deportes Acción" data-channel="deportes_03">
                <div class="aspect-[16/9] rounded-md overflow-hidden bg-zinc-800 relative shadow-lg">
                    <img src="https://placehold.co/600x338/18181b/e4e4e7?text=Deportes" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity">
                    <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-1 rounded text-xs font-bold text-white border border-zinc-700">DEPORTES</div>
                </div>
                <p class="mt-2 text-sm font-medium text-zinc-300 group-hover:text-white transition-colors">Deportes Acción</p>
            </div>

        </div>
    </section>

    <!-- Application Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- STATE & URL PARAMS ---
        const urlParams = new URLSearchParams(window.location.search);
        const sharedRoom = urlParams.get('room');

        let currentChannelId = sharedRoom ? sharedRoom : "docu_01";
        let activeHls = null;

        // --- SIDEBAR MENU LOGIC ---
        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const openMenuBtn = document.getElementById('openMenuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const menuDefaultHome = document.getElementById('menuDefaultHome');

        function openMenu() {
            sidebar.classList.remove('-translate-x-full');
            sidebarBackdrop.classList.remove('hidden');
        }
        function closeMenu() {
            sidebar.classList.add('-translate-x-full');
            sidebarBackdrop.classList.add('hidden');
        }

        openMenuBtn.addEventListener('click', openMenu);
        closeMenuBtn.addEventListener('click', closeMenu);
        sidebarBackdrop.addEventListener('click', closeMenu);
        menuDefaultHome.addEventListener('click', () => {
            loadDefaultStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'Documentales TV - En Vivo', 'docu_01');
            closeMenu();
        });

        // --- VIDEO PLAYER SETUP ---
        const video = document.getElementById('videoElement');
        const videoLoading = document.getElementById('videoLoading');
        const mediaTitle = document.getElementById('mediaTitle');
        const mediaDesc = document.getElementById('mediaDesc');

        function playStream(url, title, desc, roomId) {
            mediaTitle.innerText = title;
            mediaDesc.innerText = desc;
            currentChannelId = roomId || 'custom_' + Math.abs(hashCode(url));

            if (activeHls) {
                activeHls.destroy();
                activeHls = null;
            }

            if (url.includes('.m3u8') && Hls.isSupported()) {
                activeHls = new Hls();
                videoLoading.classList.remove('hidden');
                activeHls.loadSource(url);
                activeHls.attachMedia(video);
                activeHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoLoading.classList.add('hidden');
                    video.play().catch(() => {});
                });
                activeHls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) videoLoading.classList.add('hidden');
                });
            } else {
                video.src = url;
                video.play().catch(() => {});
            }

            // Re-subscribe chat to new room
            if (currentUser && userNickname) {
                subscribeToMessages();
            }
        }

        function loadDefaultStream(url, title, chId) {
            playStream(url, title, 'Transmisión en vivo', chId);
        }

        // Handle Carousel clicks
        document.querySelectorAll('.channel-card').forEach(card => {
            card.addEventListener('click', () => {
                const src = card.getAttribute('data-src');
                const title = card.getAttribute('data-title');
                const ch = card.getAttribute('data-channel');
                loadDefaultStream(src, title, ch);
            });
        });

        // --- LOCAL FILE & M3U LOADERS ---
        const localFileInput = document.getElementById('localFileInput');
        localFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const fileUrl = URL.createObjectURL(file);
                const safeRoomId = 'local_' + file.name.replace(/[^a-zA-Z0-9]/g, '_');
                playStream(fileUrl, file.name, 'Reproducción de archivo local', safeRoomId);
                closeMenu();
            }
        });

        const loadM3uBtn = document.getElementById('loadM3uBtn');
        loadM3uBtn.addEventListener('click', () => {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (url) {
                playStream(url, 'Stream M3U Personalizado', url, 'm3u_' + Math.abs(hashCode(url)));
                closeMenu();
            }
        });

        const loadXtreamBtn = document.getElementById('loadXtreamBtn');
        loadXtreamBtn.addEventListener('click', () => {
            const server = document.getElementById('xtreamUrl').value.trim();
            const user = document.getElementById('xtreamUser').value.trim();
            const pass = document.getElementById('xtreamPass').value.trim();
            if (server && user && pass) {
                const dummyStreamUrl = `${server}/live/${user}/${pass}/stream.m3u8`;
                playStream(dummyStreamUrl, 'Xtream Codes Stream', server, 'xtream_' + user);
                closeMenu();
            }
        });

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return hash;
        }

        // --- CHAT UI LAYOUT CONTROLS ---
        const toggleMiniChatBtn = document.getElementById('toggleMiniChatBtn');
        const miniChatOverlay = document.getElementById('miniChatOverlay');
        const chatSettingsBtn = document.getElementById('chatSettingsBtn');
        const chatSettingsPanel = document.getElementById('chatSettingsPanel');
        const layoutSelect = document.getElementById('layoutSelect');
        const posSettingWrap = document.getElementById('posSettingWrap');
        const sizeSettingWrap = document.getElementById('sizeSettingWrap');
        const posSelect = document.getElementById('posSelect');
        const sizeSelect = document.getElementById('sizeSelect');
        const mediaLayoutWrapper = document.getElementById('mediaLayoutWrapper');
        const shareRoomBtn = document.getElementById('shareRoomBtn');

        let miniChatVisible = true;

        toggleMiniChatBtn.addEventListener('click', () => {
            miniChatVisible = !miniChatVisible;
            updateChatLayout();
            if (miniChatVisible) {
                toggleMiniChatBtn.classList.replace('bg-zinc-800/80', 'bg-red-600/90');
            } else {
                toggleMiniChatBtn.classList.replace('bg-red-600/90', 'bg-zinc-800/80');
                chatSettingsPanel.classList.add('hidden');
            }
        });

        chatSettingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            chatSettingsPanel.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!chatSettingsPanel.contains(e.target) && e.target !== chatSettingsBtn) {
                chatSettingsPanel.classList.add('hidden');
            }
        });

        function updateChatLayout() {
            const layout = layoutSelect.value;
            const pos = posSelect.value;
            const size = sizeSelect.value;

            mediaLayoutWrapper.className = 'w-full relative bg-black transition-all duration-300';
            miniChatOverlay.className = 'chat-panel flex flex-col z-30 transition-all duration-300 shadow-2xl';

            if (!miniChatVisible) {
                miniChatOverlay.classList.add('hidden');
                return;
            }

            if (layout === 'floating') {
                posSettingWrap.classList.remove('hidden');
                sizeSettingWrap.classList.remove('hidden');
                miniChatOverlay.classList.add('absolute', 'bg-black/40', 'backdrop-blur-md', 'rounded-xl', 'border', 'border-white/20');
                
                if (size === 'small') miniChatOverlay.classList.add('w-64', 'h-[40%]');
                else if (size === 'medium') miniChatOverlay.classList.add('w-80', 'h-[60%]');
                else if (size === 'large') miniChatOverlay.classList.add('w-96', 'h-[80%]');
                
                if (pos === 'tl') miniChatOverlay.classList.add('top-4', 'left-4');
                else if (pos === 'tr') miniChatOverlay.classList.add('top-4', 'right-4');
                else if (pos === 'bl') miniChatOverlay.classList.add('bottom-4', 'left-4');
                else if (pos === 'br') miniChatOverlay.classList.add('bottom-4', 'right-4');
            } else {
                posSettingWrap.classList.add('hidden');
                sizeSettingWrap.classList.add('hidden');
                miniChatOverlay.classList.add('relative', 'bg-zinc-900', 'border-zinc-800');
                mediaLayoutWrapper.classList.add('layout-' + layout);
            }
        }

        layoutSelect.addEventListener('change', updateChatLayout);
        posSelect.addEventListener('change', updateChatLayout);
        sizeSelect.addEventListener('change', updateChatLayout);
        updateChatLayout();

        shareRoomBtn.addEventListener('click', () => {
            const shareUrl = `${window.location.origin}${window.location.pathname}?room=${currentChannelId}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('¡Enlace de la sala copiado al portapapeles!\n\nCompártelo con otros usuarios para que entren a tu misma transmisión y chat.');
                chatSettingsPanel.classList.add('hidden');
            });
        });

        // --- FIREBASE CHAT SYSTEM ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'xtream-tv-app';
        let firebaseConfig = {};
        try {
            if (typeof __firebase_config !== 'undefined') firebaseConfig = JSON.parse(__firebase_config);
        } catch (e) {}

        let app, db, auth, currentUser;
        let unsubscribeCurrentChat = null;

        const nicknameSetup = document.getElementById('nicknameSetup');
        const activeChat = document.getElementById('activeChat');
        const nicknameInput = document.getElementById('nicknameInput');
        const joinChatBtn = document.getElementById('joinChatBtn');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const miniMessagesList = document.getElementById('miniMessagesList');

        async function initFirebase() {
            if (Object.keys(firebaseConfig).length === 0) {
                miniMessagesList.innerHTML = `<div class="p-2 bg-red-900/80 text-red-200 text-xs rounded text-center">Modo demo sin Firebase.</div>`;
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;

                joinChatBtn.addEventListener('click', handleJoinChat);
                nicknameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleJoinChat(); });

                if (sharedRoom) {
                    nicknameInput.value = "Invitado_" + Math.floor(Math.random() * 1000);
                    handleJoinChat();
                }
            } catch (error) {
                console.error("Firebase init error:", error);
            }
        }

        function handleJoinChat() {
            const nick = nicknameInput.value.trim();
            if (nick.length > 0) {
                userNickname = nick;
                nicknameSetup.classList.add('hidden');
                activeChat.classList.add('flex');
                messageInput.focus();
                subscribeToMessages();
            }
        }

        function subscribeToMessages() {
            if (!currentUser) return;
            if (unsubscribeCurrentChat) unsubscribeCurrentChat();

            const chatRef = collection(db, 'artifacts', appId, 'public', 'data', `chat_${currentChannelId}`);
            
            unsubscribeCurrentChat = onSnapshot(chatRef, (snapshot) => {
                const messages = [];
                snapshot.forEach(doc => messages.push({ id: doc.id, ...doc.data() }));
                messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                miniMessagesList.innerHTML = '';
                messages.slice(-50).forEach(msg => {
                    miniMessagesList.appendChild(renderMiniMessage(msg));
                });
                miniMessagesList.scrollTop = miniMessagesList.scrollHeight;
            });
        }

        function renderMiniMessage(msgData) {
            const isMe = msgData.senderId === currentUser.uid;
            const msgEl = document.createElement('div');
            msgEl.className = 'flex flex-col w-full mb-1';
            
            if (isMe) {
                msgEl.innerHTML = `
                    <div class="self-end max-w-[90%]">
                        <span class="block text-[10px] font-bold text-red-400 text-shadow-video text-right mb-0.5">Tú</span>
                        <div class="bg-red-600/80 backdrop-blur-sm text-white px-2 py-1.5 rounded-lg rounded-tr-sm text-xs break-words shadow-md border border-red-500/50 inline-block">
                            ${escapeHTML(msgData.text)}
                        </div>
                    </div>
                `;
            } else {
                msgEl.innerHTML = `
                    <div class="self-start max-w-[90%]">
                        <span class="block text-[10px] font-bold text-zinc-300 text-shadow-video mb-0.5">${escapeHTML(msgData.nickname)}</span>
                        <div class="bg-black/60 backdrop-blur-sm text-zinc-100 px-2 py-1.5 rounded-lg rounded-tl-sm text-xs break-words border border-white/10 shadow-md inline-block">
                            ${escapeHTML(msgData.text)}
                        </div>
                    </div>
                `;
            }
            return msgEl;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            messageInput.value = '';
            const chatRef = collection(db, 'artifacts', appId, 'public', 'data', `chat_${currentChannelId}`);
            
            try {
                await addDoc(chatRef, {
                    text: text,
                    nickname: userNickname,
                    senderId: currentUser.uid,
                    timestamp: Date.now()
                });
            } catch (error) {
                console.error("Error sending message:", error);
            }
        });

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // If sharedRoom was passed, auto-load stream placeholder if needed
        if (sharedRoom) {
            mediaTitle.innerText = "Sala Compartida";
            mediaDesc.innerText = "ID de Sala: " + sharedRoom;
        }

        initFirebase();
    </script>
</body>
</html>
