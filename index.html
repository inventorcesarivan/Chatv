<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto xtream tv</title>
    <!-- Tailwind CSS for sleek, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for m3u8 playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    
    <style>
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b; /* zinc-900 */
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46; /* zinc-700 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b; /* zinc-600 */
        }

        /* Hide scrollbar for the channel carousel but keep it scrollable */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Netflix-style typography and smooth transitions */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #09090b; /* zinc-950 */
            color: #f4f4f5; /* zinc-100 */
        }

        .channel-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .channel-card:hover {
            transform: scale(1.05);
        }

        /* Text shadow for better readability over video */
        .text-shadow-video {
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9), 0px 0px 5px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="w-full py-4 px-6 md:px-12 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent fixed top-0 z-50 pointer-events-none">
        <h1 class="text-3xl font-black tracking-tighter text-red-600 drop-shadow-md pointer-events-auto">XTREAM<span class="text-white">TV</span></h1>
        <div class="pointer-events-auto flex gap-2">
            <button id="toggleMiniChatBtn" class="bg-red-600/90 hover:bg-red-700 text-white text-sm font-medium py-2 px-4 rounded-full backdrop-blur-sm transition-colors border border-red-500 shadow-lg flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                </svg>
                Chat en pantalla
            </button>
        </div>
    </header>

    <!-- Main Content Area: Player -->
    <main class="flex-grow flex flex-col pt-[72px] lg:pt-[80px] px-4 md:px-8 gap-4 max-w-[1920px] mx-auto w-full">
        
        <!-- Video Player Section -->
        <section id="playerContainer" class="w-full flex flex-col rounded-xl overflow-hidden bg-black shadow-2xl relative border border-zinc-800 transition-all duration-300 mx-auto">
            
            <!-- FLEX WRAPPER FOR VIDEO AND CHAT -->
            <div id="mediaLayoutWrapper" class="flex w-full relative bg-black transition-all duration-300">
                
                <!-- Video Column -->
                <div id="videoCol" class="flex-grow relative w-full flex flex-col justify-center">
                    <div class="aspect-video w-full bg-black relative overflow-hidden group">
                        <video id="videoElement" class="w-full h-full object-contain" controls autoplay playsinline></video>
                        <!-- Loading overlay -->
                        <div id="videoLoading" class="absolute inset-0 flex items-center justify-center bg-black/50 hidden">
                            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600"></div>
                        </div>
                    </div>
                </div>

                <!-- Chat Overlay / Docked Panel -->
                <div id="miniChatOverlay" class="absolute top-4 left-4 w-80 h-[60%] bg-black/40 backdrop-blur-md rounded-xl border border-white/20 flex flex-col z-30 transition-all duration-300 shadow-2xl">
                    <!-- Header -->
                    <div class="px-3 py-2 border-b border-white/20 bg-black/60 flex justify-between items-center">
                        <span class="text-xs font-bold text-white/90 drop-shadow-md flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></span>
                            Chat en vivo
                        </span>
                        <button id="chatSettingsBtn" class="text-white/70 hover:text-white transition-colors p-1 rounded hover:bg-white/10">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>

                    <!-- Settings Panel -->
                    <div id="chatSettingsPanel" class="hidden absolute top-10 right-2 bg-zinc-900 border border-zinc-700 rounded-lg shadow-xl z-40 w-64 p-3 text-sm flex flex-col gap-3">
                        <div>
                            <label class="text-zinc-400 text-xs font-bold block mb-1">Opciones de Vista (Layout)</label>
                            <select id="layoutSelect" class="w-full bg-zinc-800 text-white text-xs border border-zinc-700 rounded p-1 focus:outline-none focus:border-red-500">
                                <option value="floating">Flotante (Overlay)</option>
                                <option value="right">A la derecha</option>
                                <option value="left">A la izquierda</option>
                                <option value="bottom">Debajo del video</option>
                                <option value="top">Arriba del video</option>
                            </select>
                        </div>
                        <div id="posSettingWrap">
                            <label class="text-zinc-400 text-xs font-bold block mb-1">Posición (Modo Flotante)</label>
                            <select id="posSelect" class="w-full bg-zinc-800 text-white text-xs border border-zinc-700 rounded p-1 focus:outline-none focus:border-red-500">
                                <option value="tl">Arriba Izquierda</option>
                                <option value="tr">Arriba Derecha</option>
                                <option value="bl">Abajo Izquierda</option>
                                <option value="br">Abajo Derecha</option>
                            </select>
                        </div>
                        <div id="sizeSettingWrap">
                            <label class="text-zinc-400 text-xs font-bold block mb-1">Tamaño (Modo Flotante)</label>
                            <select id="sizeSelect" class="w-full bg-zinc-800 text-white text-xs border border-zinc-700 rounded p-1 focus:outline-none focus:border-red-500">
                                <option value="medium">Mediano</option>
                                <option value="small">Pequeño</option>
                                <option value="large">Grande</option>
                            </select>
                        </div>
                        <button id="popOutBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white text-xs py-1.5 rounded border border-zinc-600 flex items-center justify-center gap-1 transition-colors mt-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                            Pop-out Chat
                        </button>
                    </div>

                    <!-- Setup Nickname -->
                    <div id="nicknameSetup" class="flex flex-col items-center justify-center flex-grow p-4 bg-black/40">
                        <input type="text" id="nicknameInput" placeholder="Elige un apodo..." class="w-full px-3 py-1.5 bg-black/60 border border-white/20 rounded-md text-white text-sm focus:outline-none focus:border-red-500 mb-2" maxlength="15">
                        <button id="joinChatBtn" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-1.5 rounded-md transition-colors">Entrar al Chat</button>
                    </div>

                    <!-- Messages Container -->
                    <div id="activeChat" class="hidden flex-col flex-grow overflow-hidden">
                        <div id="miniMessagesList" class="flex-grow overflow-y-auto p-3 flex flex-col gap-2 relative">
                            <!-- Messages injected via JS -->
                        </div>
                        <!-- Chat Input -->
                        <div class="p-2 bg-black/60 border-t border-white/20">
                            <form id="chatForm" class="flex gap-2">
                                <input type="text" id="messageInput" placeholder="Mensaje..." class="flex-grow px-2 py-1.5 bg-black/40 border border-white/20 rounded text-xs text-white focus:outline-none focus:border-red-500 placeholder-zinc-400" autocomplete="off">
                                <button type="submit" id="sendBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded transition-colors flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Video Info Bar -->
            <div class="p-4 bg-zinc-900 border-t border-zinc-800 w-full z-20">
                <h2 class="text-xl font-bold">Documentales TV - En Vivo</h2>
                <p class="text-zinc-400 text-sm mt-1">Transmisión de prueba (HLS / m3u8)</p>
            </div>
        </section>
    </main>

    <!-- Channels Carousel (Netflix style) -->
    <section class="mt-8 mb-12 px-4 md:px-8 w-full max-w-[1920px] mx-auto">
        <h3 class="text-xl font-bold mb-4 px-2">Canales Sugeridos</h3>
        <div class="flex gap-4 overflow-x-auto no-scrollbar pb-4 px-2 snap-x snap-mandatory">
            
            <!-- Dummy Channel Cards -->
            <div class="channel-card snap-start flex-shrink-0 w-[240px] md:w-[280px] cursor-pointer group">
                <div class="aspect-[16/9] rounded-md overflow-hidden bg-zinc-800 relative shadow-lg">
                    <img src="https://placehold.co/600x338/18181b/e4e4e7?text=Canal+Cine" alt="Canal Cine" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity">
                    <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-1 rounded text-xs font-bold text-white border border-zinc-700">CINE PREMIUM</div>
                </div>
                <p class="mt-2 text-sm font-medium text-zinc-300 group-hover:text-white transition-colors">Películas 24/7</p>
            </div>

            <div class="channel-card snap-start flex-shrink-0 w-[240px] md:w-[280px] cursor-pointer group">
                <div class="aspect-[16/9] rounded-md overflow-hidden bg-zinc-800 relative shadow-lg">
                    <img src="https://placehold.co/600x338/18181b/e4e4e7?text=Deportes+TV" alt="Deportes" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity">
                    <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-1 rounded text-xs font-bold text-white border border-zinc-700">DEPORTES</div>
                </div>
                <p class="mt-2 text-sm font-medium text-zinc-300 group-hover:text-white transition-colors">Fútbol Internacional en Vivo</p>
            </div>

            <div class="channel-card snap-start flex-shrink-0 w-[240px] md:w-[280px] cursor-pointer group">
                <div class="aspect-[16/9] rounded-md overflow-hidden bg-zinc-800 relative shadow-lg ring-2 ring-red-600 ring-offset-2 ring-offset-zinc-950">
                    <img src="https://placehold.co/600x338/18181b/e4e4e7?text=Docu+TV" alt="Documentales" class="w-full h-full object-cover opacity-80">
                    <div class="absolute bottom-2 left-2 bg-red-600 px-2 py-1 rounded text-xs font-bold text-white shadow-md">REPRODUCIENDO</div>
                </div>
                <p class="mt-2 text-sm font-bold text-white">Documentales TV</p>
            </div>

            <div class="channel-card snap-start flex-shrink-0 w-[240px] md:w-[280px] cursor-pointer group">
                <div class="aspect-[16/9] rounded-md overflow-hidden bg-zinc-800 relative shadow-lg">
                    <img src="https://placehold.co/600x338/18181b/e4e4e7?text=Noticias+24h" alt="Noticias" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity">
                    <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-1 rounded text-xs font-bold text-white border border-zinc-700">NOTICIAS</div>
                </div>
                <p class="mt-2 text-sm font-medium text-zinc-300 group-hover:text-white transition-colors">Titulares del mundo</p>
            </div>
            
            <div class="channel-card snap-start flex-shrink-0 w-[240px] md:w-[280px] cursor-pointer group">
                <div class="aspect-[16/9] rounded-md overflow-hidden bg-zinc-800 relative shadow-lg">
                    <img src="https://placehold.co/600x338/18181b/e4e4e7?text=Kids+Club" alt="Infantil" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity">
                    <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-1 rounded text-xs font-bold text-white border border-zinc-700">INFANTIL</div>
                </div>
                <p class="mt-2 text-sm font-medium text-zinc-300 group-hover:text-white transition-colors">Dibujos animados clásicos</p>
            </div>

        </div>
    </section>

    <!-- Firebase & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. VIDEO PLAYER SETUP (HLS.js) ---
        const video = document.getElementById('videoElement');
        const videoLoading = document.getElementById('videoLoading');
        // Usamos un stream público gratuito de prueba (Big Buck Bunny)
        const videoSrc = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'; 

        if (Hls.isSupported()) {
            const hls = new Hls();
            videoLoading.classList.remove('hidden');
            
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                videoLoading.classList.add('hidden');
                video.play().catch(e => console.log("Autoplay blocked by browser. User interaction needed."));
            });
            
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    console.error("HLS Error:", data);
                    // Add basic error handling UI if needed
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari nativo
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        // --- 2. UI INTERACTIONS ---
        const toggleMiniChatBtn = document.getElementById('toggleMiniChatBtn');
        const miniChatOverlay = document.getElementById('miniChatOverlay');
        const chatSettingsBtn = document.getElementById('chatSettingsBtn');
        const chatSettingsPanel = document.getElementById('chatSettingsPanel');
        const layoutSelect = document.getElementById('layoutSelect');
        const posSettingWrap = document.getElementById('posSettingWrap');
        const sizeSettingWrap = document.getElementById('sizeSettingWrap');
        const posSelect = document.getElementById('posSelect');
        const sizeSelect = document.getElementById('sizeSelect');
        const popOutBtn = document.getElementById('popOutBtn');
        const mediaLayoutWrapper = document.getElementById('mediaLayoutWrapper');
        
        let miniChatVisible = true;

        toggleMiniChatBtn.addEventListener('click', () => {
            miniChatVisible = !miniChatVisible;
            updateChatLayout(); // Applica la visibilidad de manera segura
            
            if (miniChatVisible) {
                toggleMiniChatBtn.classList.remove('bg-zinc-800/80', 'border-zinc-600');
                toggleMiniChatBtn.classList.add('bg-red-600/90', 'border-red-500');
            } else {
                toggleMiniChatBtn.classList.add('bg-zinc-800/80', 'border-zinc-600');
                toggleMiniChatBtn.classList.remove('bg-red-600/90', 'border-red-500');
                chatSettingsPanel.classList.add('hidden'); // close settings if open
            }
        });

        // Settings Toggle
        chatSettingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            chatSettingsPanel.classList.toggle('hidden');
        });

        // Hide settings when clicking outside
        document.addEventListener('click', (e) => {
            if (!chatSettingsPanel.contains(e.target) && e.target !== chatSettingsBtn && !chatSettingsBtn.contains(e.target)) {
                chatSettingsPanel.classList.add('hidden');
            }
        });

        // Master function to manage Flexbox Layouts and Absolute positions
        function updateChatLayout() {
            const layout = layoutSelect.value;
            const pos = posSelect.value;
            const size = sizeSelect.value;

            // Reset wrappers to default states
            mediaLayoutWrapper.className = 'flex w-full relative bg-black transition-all duration-300 overflow-hidden rounded-t-xl';
            miniChatOverlay.className = 'flex flex-col z-30 transition-all duration-300 shadow-2xl';

            if (!miniChatVisible) {
                miniChatOverlay.classList.add('hidden');
                return; // Stop applying layout styling if the chat is hidden
            }

            if (layout === 'floating') {
                // Show floating-specific settings
                posSettingWrap.classList.remove('hidden');
                sizeSettingWrap.classList.remove('hidden');
                
                // Apply Floating (Overlay) classes
                miniChatOverlay.classList.add('absolute', 'bg-black/40', 'backdrop-blur-md', 'rounded-xl', 'border', 'border-white/20');
                
                // Apply Size
                if (size === 'small') miniChatOverlay.classList.add('w-64', 'h-[40%]');
                else if (size === 'medium') miniChatOverlay.classList.add('w-80', 'h-[60%]');
                else if (size === 'large') miniChatOverlay.classList.add('w-96', 'h-[80%]');
                
                // Apply Position
                if (pos === 'tl') miniChatOverlay.classList.add('top-4', 'left-4');
                else if (pos === 'tr') miniChatOverlay.classList.add('top-4', 'right-4');
                else if (pos === 'bl') miniChatOverlay.classList.add('bottom-4', 'left-4');
                else if (pos === 'br') miniChatOverlay.classList.add('bottom-4', 'right-4');
                
            } else {
                // Docked Layouts (Outside the video)
                posSettingWrap.classList.add('hidden');
                sizeSettingWrap.classList.add('hidden');
                
                // Convert chat to a solid panel
                miniChatOverlay.classList.add('relative', 'bg-zinc-900', 'border-zinc-800');
                
                if (layout === 'right') {
                    mediaLayoutWrapper.classList.add('flex-col', 'md:flex-row'); // Stack on mobile, side-by-side on desktop
                    miniChatOverlay.classList.add('w-full', 'md:w-[350px]', 'h-[300px]', 'md:h-auto', 'border-l', 'flex-shrink-0');
                } else if (layout === 'left') {
                    mediaLayoutWrapper.classList.add('flex-col', 'md:flex-row-reverse');
                    miniChatOverlay.classList.add('w-full', 'md:w-[350px]', 'h-[300px]', 'md:h-auto', 'border-r', 'flex-shrink-0');
                } else if (layout === 'bottom') {
                    mediaLayoutWrapper.classList.add('flex-col');
                    miniChatOverlay.classList.add('w-full', 'h-[350px]', 'border-t');
                } else if (layout === 'top') {
                    mediaLayoutWrapper.classList.add('flex-col-reverse');
                    miniChatOverlay.classList.add('w-full', 'h-[350px]', 'border-b');
                }
            }
        }

        // Attach the single layout manager to all select inputs
        layoutSelect.addEventListener('change', updateChatLayout);
        posSelect.addEventListener('change', updateChatLayout);
        sizeSelect.addEventListener('change', updateChatLayout);

        // Initialize layout classes on page load
        updateChatLayout();

        // Handle Pop-out Feature
        popOutBtn.addEventListener('click', () => {
            alert('En un entorno real, esto abriría una ventana usando window.open().\n\nPor políticas de seguridad del navegador y de iframes, se extraería el chat a una URL como:\nwindow.open("/chat-only?channel=documentales_tv_01", "Chat", "width=350,height=550");');
            chatSettingsPanel.classList.add('hidden');
        });


        // --- 3. FIREBASE SETUP & CHAT LOGIC ---
        // Context environment variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'xtream-tv-app';
        let firebaseConfig = {};
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.warn("No custom firebase config found, using dummy/defaults if any");
        }

        let app, db, auth, currentUser;
        
        // Chat DOM elements
        const nicknameSetup = document.getElementById('nicknameSetup');
        const activeChat = document.getElementById('activeChat');
        const nicknameInput = document.getElementById('nicknameInput');
        const joinChatBtn = document.getElementById('joinChatBtn');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const miniMessagesList = document.getElementById('miniMessagesList');
        
        let userNickname = "";
        // We use a specific channel ID for this chat room
        const channelId = "documentales_tv_01"; 

        async function initFirebase() {
            if (Object.keys(firebaseConfig).length === 0) {
                miniMessagesList.innerHTML = `<div class="p-2 bg-red-900/80 text-red-200 text-xs rounded border border-red-800 text-center">Modo demo sin conexión.</div>`;
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Wait for Auth BEFORE attempting any queries
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                
                // Allow user to join chat now that backend is ready
                joinChatBtn.addEventListener('click', handleJoinChat);
                nicknameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleJoinChat();
                });

            } catch (error) {
                console.error("Error initializing Firebase:", error);
                miniMessagesList.innerHTML = `<div class="p-2 bg-red-900/80 text-red-200 text-xs rounded border border-red-800 text-center">Error de conexión.</div>`;
            }
        }

        function handleJoinChat() {
            const nick = nicknameInput.value.trim();
            if (nick.length > 0) {
                userNickname = nick;
                nicknameSetup.classList.add('hidden');
                activeChat.classList.remove('hidden');
                activeChat.classList.add('flex');
                
                messageInput.focus();
                
                // Start listening to messages for this channel
                subscribeToMessages();
            }
        }

        function renderMessage(msgData) {
            const isMe = msgData.senderId === currentUser.uid;
            const msgEl = document.createElement('div');
            
            // Stylize differently if it's my message vs others
            if (isMe) {
                msgEl.className = 'flex flex-col items-end w-full animate-fade-in-up';
                msgEl.innerHTML = `
                    <div class="bg-red-600 text-white px-3 py-2 rounded-lg rounded-tr-sm max-w-[85%] text-sm break-words shadow-sm">
                        ${escapeHTML(msgData.text)}
                    </div>
                    <span class="text-[10px] text-zinc-500 mt-1">${formatTime(msgData.timestamp)}</span>
                `;
            } else {
                msgEl.className = 'flex flex-col items-start w-full animate-fade-in-up';
                msgEl.innerHTML = `
                    <span class="text-[11px] font-bold text-zinc-400 mb-0.5 ml-1">${escapeHTML(msgData.nickname)}</span>
                    <div class="bg-zinc-800 text-zinc-100 px-3 py-2 rounded-lg rounded-tl-sm max-w-[85%] text-sm break-words border border-zinc-700 shadow-sm">
                        ${escapeHTML(msgData.text)}
                    </div>
                `;
            }
            return msgEl;
        }

        // Render template for the floating minichat (Compact and optimized for video background)
        function renderMiniMessage(msgData) {
            const isMe = msgData.senderId === currentUser.uid;
            const msgEl = document.createElement('div');
            msgEl.className = 'flex flex-col w-full animate-fade-in-up mb-1';
            
            if (isMe) {
                msgEl.innerHTML = `
                    <div class="self-end max-w-[90%]">
                        <span class="block text-[10px] font-bold text-red-400 text-shadow-video text-right mb-0.5">Tú</span>
                        <div class="bg-red-600/80 backdrop-blur-sm text-white px-2 py-1.5 rounded-lg rounded-tr-sm text-xs break-words shadow-md border border-red-500/50 inline-block">
                            ${escapeHTML(msgData.text)}
                        </div>
                    </div>
                `;
            } else {
                msgEl.innerHTML = `
                    <div class="self-start max-w-[90%]">
                        <span class="block text-[10px] font-bold text-zinc-300 text-shadow-video mb-0.5">${escapeHTML(msgData.nickname)}</span>
                        <div class="bg-black/60 backdrop-blur-sm text-zinc-100 px-2 py-1.5 rounded-lg rounded-tl-sm text-xs break-words border border-white/10 shadow-md inline-block">
                            ${escapeHTML(msgData.text)}
                        </div>
                    </div>
                `;
            }
            return msgEl;
        }

        function subscribeToMessages() {
            if (!currentUser) return;
            
            const chatRef = collection(db, 'artifacts', appId, 'public', 'data', `chat_${channelId}`);
            
            onSnapshot(chatRef, (snapshot) => {
                const messages = [];
                snapshot.forEach((doc) => {
                    messages.push({ id: doc.id, ...doc.data() });
                });

                // Sort by timestamp in memory (ascending)
                messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                // Clear current list
                miniMessagesList.innerHTML = '';
                
                // Limit to last 50 messages in memory to prevent DOM lag
                const displayMessages = messages.slice(-50);
                
                displayMessages.forEach(msg => {
                    miniMessagesList.appendChild(renderMiniMessage(msg));
                });
                
                // Auto-scroll to bottom
                miniMessagesList.scrollTop = miniMessagesList.scrollHeight;

            }, (error) => {
                console.error("Error fetching messages:", error);
            });
        }

        // Send new message
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            // Clear input immediately for better UX
            messageInput.value = '';
            
            const chatRef = collection(db, 'artifacts', appId, 'public', 'data', `chat_${channelId}`);
            
            try {
                await addDoc(chatRef, {
                    text: text,
                    nickname: userNickname,
                    senderId: currentUser.uid,
                    timestamp: Date.now()
                });
            } catch (error) {
                console.error("Error sending message:", error);
                const err = document.createElement('div');
                err.className = 'text-[10px] text-red-500 text-center py-1 bg-black/50 rounded';
                err.innerText = 'Error al enviar.';
                miniMessagesList.appendChild(err);
                miniMessagesList.scrollTop = miniMessagesList.scrollHeight;
            }
        });

        // Utility: HTML Escaping to prevent XSS in chat
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Utility: Format timestamp
        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Start everything
        initFirebase();

    </script>

    <style>
        /* Small animation utility for chat messages */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</body>
</html>
